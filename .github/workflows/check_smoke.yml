on: [push, pull_request]

name: Smoke test on Ubuntu

jobs:
  check:
    strategy:
      matrix:
        os: ["ubuntu-24.04", "ubuntu-24.04-arm"] 
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Run build
        run: |
          sudo apt-get update
          sudo apt-get install libgoogle-perftools-dev libunwind-dev libacl1-dev liburing-dev liburcu-dev uuid-dev libtirpc-dev
          ./autogen.sh
          ./configure
          make
